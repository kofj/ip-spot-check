triggers:
  roadmap_change:
    enabled: true
    channels: [wecom, email]
    priority: "high"
  consecutive_failure:
    enabled: true
    channels: [wecom, bark, telegram]
    priority: "critical"
  hypothesis_invalid:
    enabled: true
    channels: [wecom, email]
    priority: "high"
  model_disagreement:
    enabled: true
    channels: [wecom]
    priority: "medium"
  tech_debt_threshold:
    enabled: true
    channels: [wecom, email]
    priority: "high"
  stage_complete:
    enabled: true
    channels: [wecom, email]
    priority: "normal"
  daily_report:
    enabled: true
    channels: [email]
    priority: "low"
    schedule: "09:00"
    timezone: "Asia/Shanghai"
  weekly_report:
    enabled: true
    channels: [email]
    priority: "low"
    schedule: "Monday 09:00"
    timezone: "Asia/Shanghai"

retry:
  max_attempts: 3
  backoff: exponential
  initial_delay: 1s
  max_delay: 30s
